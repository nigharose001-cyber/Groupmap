<!DOCTYPE html>
<html>
<head>
  <title>Live Location Tracker - Rooms</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; background: #f0f0f0; }
    #setup-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 20px; text-align: center; }
    input { padding: 12px; font-size: 16px; width: 80%; max-width: 300px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; text-align: center; }
    button { padding: 12px 24px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; }

    #map-screen { display: none; width: 100%; height: 100%; position: relative; }
    #status { position: absolute; top: 0; left: 0; width: 100%; z-index: 9999; padding: 10px; background: rgba(0,0,0,0.8); color: #fff; font-size: 12px; text-align: center; }
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>

  <!-- STEP 1: ROOM SETUP SCREEN -->
  <div id="setup-screen">
    <h2>Join a Tracking Room</h2>
    <p>Enter a shared room code (up to 15 users max)</p>
    <input type="text" id="roomCodeInput" placeholder="e.g. 5555" maxlength="6">
    <br>
    <button onclick="joinRoom()">Start Tracking</button>
  </div>

  <!-- STEP 2: LIVE MAP SCREEN -->
  <div id="map-screen">
    <div id="status">Connecting to room...</div>
    <div id="map"></div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCLIjAdw70O_Dtgb28at7ib66opgwR33iM",
      authDomain: "live-location-app-f079d.firebaseapp.com",
      databaseURL: "https://live-location-app-f079d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "live-location-app-f079d",
      storageBucket: "live-location-app-f079d.firebasestorage.app",
      messagingSenderId: "350033227427",
      appId: "1:350033227427:web:222853633c03187d819916"
    };

    firebase.initializeApp(firebaseConfig);

    let map, markers = {}, hasCentered = false;

    function joinRoom() {
      const roomCode = document.getElementById("roomCodeInput").value.trim();
      if (!roomCode) {
        alert("Please enter a valid room code!");
        return;
      }

      // Switch screens
      document.getElementById("setup-screen").style.display = "none";
      document.getElementById("map-screen").style.display = "block";

      initMapAndTracking(roomCode);
    }

    function initMapAndTracking(roomCode) {
      // Initialize Leaflet Map
      map = L.map('map').setView([20.5937, 78.9629], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      setTimeout(() => map.invalidateSize(), 500);

      // Anonymous Sign-In
      firebase.auth().signInAnonymously().then((userCredential) => {
        const userId = userCredential.user.uid;
        document.getElementById("status").innerText = "Joined room: " + roomCode + " | Waiting for GPS...";

        // Watch GPS and save to specific room path
        if ("geolocation" in navigator) {
          navigator.geolocation.watchPosition(
            (position) => {
              const lat = position.coords.latitude;
              const lng = position.coords.longitude;
              document.getElementById("status").innerText = "Room: " + roomCode + " | Live Location Active";

              firebase.database().ref(`rooms/${roomCode}/locations/${userId}`).set({
                lat: lat,
                lng: lng,
                timestamp: Date.now()
              });
            },
            (err) => { document.getElementById("status").innerText = "GPS Error: " + err.message; },
            { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
          );
        }

        // Listen only to users inside THIS room code
        firebase.database().ref(`rooms/${roomCode}/locations`).on('value', (snapshot) => {
          const allUsers = snapshot.val() || {};

          Object.keys(allUsers).forEach((id) => {
            const userInfo = allUsers[id];
            if (!userInfo.lat || !userInfo.lng) return;

            const latLng = [userInfo.lat, userInfo.lng];

            if (id === userId && !hasCentered) {
              map.setView(latLng, 16);
              map.invalidateSize();
              hasCentered = true;
            }

            if (markers[id]) {
              markers[id].setLatLng(latLng);
            } else {
              markers[id] = L.marker(latLng).addTo(map)
                .bindPopup(id === userId ? "<b>You</b>" : "User: " + id.substring(0, 5));
            }
          });
        });

      }).catch((error) => {
        document.getElementById("status").innerText = "Auth Error: " + error.message;
      });
    }
  </script>
</body>
</html>
